
<!doctype html>
<html>
  <head>
    <title>Demo-task 1</title>
    <script src="app.js" defer></script>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <head>
      <h1>Demo Task 1</h1>
      <hr />
      <hr />
    </head>

    <h2>User Form</h2>

    <form id="userForm" onsubmit="saveUserDetails(event)">

        <div class="inputWrapper">
            <label>Name:</label>
            <input id="name" type="text" name="userName" />
        </div>

      <div class="inputWrapper">
          <label>City:</label>
          <input id="city" type="text" name="cityName" />
      </div>

      <div class="inputWrapper">
          <label>Age:</label>
          <input id="age" type="number" name="ageData" />
      </div>

      <div class="inputWrapper">
          <button type="submit" id="saveBtn">Save</button>
          <button type="submit" id="updateBtn" style="display: none">Update</button>
          <button type="button" id="deleteBtn" style="display: none">Delete</button>
      </div>

    </form> 

    <hr />

    <label>Select based on ID:</label>
    <select id="selectId" onchange="selectOptionId()">
      <option value="">Select ID</option>
    </select>


    <h2>Filter</h2>
    <div class="inputWrapper">

        <label>Select Field:</label>
        <select id="selectField" onchange="fieldAndUnique()">
          <option value="">Select Field</option>
        </select>
    </div>
    <div class="inputWrapper">

        <label>Select Unique Value:</label>
        <select id="selectUnique">
          <option value="">Select Value</option>
        </select>
    </div>
    <div class="inputWrapper">

        <button id="filterBtn">Filter</button>
        <button id="allBtn">All</button>
    </div>

    <hr />

    <table>
        <tr>
          <th>Name</th>
          <th>City</th>
          <th>Age</th>
        </tr>
      <tbody id="recordsTable"></tbody>
    </table>
  </body>
</html>
