<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo task 1</title>
    <script src="app.js" defer></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <head>
        <h1>Demo Task 1</h1>
        <hr> <hr>
    </head>
    <section>
        <form>
            <h2>User Form</h2> 
            <label>Name:</label>
            <input type="text" id="name"> <br> <br>
            <label>City:</label>
            <input type="text" id="city"> <br> <br>
            <label>Age:</label>
            <input type="number" id="age"> <br> <br>
            <button type="button" id="saveBtn" style="display: block;">Save</button>
            <div>
            <button type="button" id="updateBtn" style="display: none;">Update</button>
            <button type="button" id="delBtn" style="display: none;">Delete</button></div>
            <hr>
            <label>Select based on ID:</label>
            <select id="selectId">
                <option value="">Select ID</option>
            </select>


        </form>
    </section>

    <section>
        <h2>Filters:</h2>
        <label>Select Field:</label>
        <select id="selectField">
            <option value="">Select Field</option>
        </select> <br> <br>
        <label>Unique Values:</label>
        <select id="selectUnique">
            <option value="">Select Value</option>
        </select> <br> <br>
        <button type="button" id="filterBtn">Filter</button>
        <button type="button" id="allBtn">All</button>
        <hr>
    </section>

    <section>
        <table id="recordsTable">
            <tr>
                <th>Name</th>
                <th>City</th>
                <th>Age</th>
            </tr>
        </table>
    </section>
    
</body>
</html>
